[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hctui"
version = "0.3.0"
description = "A lightweight, YAML-configured terminal system monitor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["urwid>=4.2.5,<5", "psutil>=7.2.2,<8", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1", "jsonschema>=4,<5", "Pillow>=10"]

[project.scripts]
hctui = "hctui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hctui = ["themes.json", "widget_schema.json", "widgets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
